<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One &amp; Done</title>
  <!--OG-->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="flow" class="flow"></div>
  <div id="game" class="app hidden">
    <header class="topbar">
      <span class="title" id="game-name">One &amp; Done</span>
      <div id="combat-bar" class="combat-bar idle"></div>
      <span class="turn-info" id="turn-info"></span>
      <button class="small hidden" id="undo-move" title="Take back your last move and get the squares back (Ctrl/Cmd+Z). Locked in once you act.">↶ Undo move</button>
      <button class="small hidden handouts-btn" id="handouts-btn" title="Handouts the DM has shared">📜 Handouts</button>
      <span class="party-list" id="party-list"></span>
      <span class="me-chip" id="me-chip" title="Change name or color"></span>
    </header>
    <div class="main play">
      <div id="board"></div>
      <aside class="right" id="panel"></aside>
    </div>
  </div>
  <script type="module" src="/js/play.js"></script>
</body>
</html>
